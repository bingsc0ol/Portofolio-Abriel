<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Untuk Selma yang selalu ceria dan ga pernah berhenti bersenyum🤩</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            color: #fff;
        }

        /* --- Bintang Latar Belakang --- */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 1;
        }

        /* --- Kontainer Tata Surya 3D (Orbit Simulation) ---. */
        .solar-system {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Matahari di Tengah */
        .sun {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #ffcc00, #ff6600);
            border-radius: 50%;
            box-shadow: 0 0 40px #ff9900, 0 0 80px #ff3300;
            position: absolute;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            transition: transform 0.3s;
        }

        .sun:hover {
            transform: scale(1.1);
        }

        /* Jalur Orbit & Planet */
        .orbit {
            position: absolute;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            animation: rotateOrbit linear infinite;
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset -4px -4px 10px rgba(0,0,0,0.6);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .planet:hover {
            transform: scale(1.3);
            box-shadow: 0 0 15px #fff;
        }

        /* Orbit 1: Planet Pertama (Merkurius/Biru) */
        .orbit-1 { width: 180px; height: 180px; animation-duration: 15s; }
        .planet-1 { width: 25px; height: 25px; background: #38bdf8; top: 15px; left: 80px; }

        /* Orbit 2: Planet Kedua (Venus/Ungu) */
        .orbit-2 { width: 300px; height: 300px; animation-duration: 25s; }
        .planet-2 { width: 35px; height: 35px; background: #a855f7; top: 30px; left: 130px; }

        /* Orbit 3: Planet Ketiga (Bumi/Hijau-Biru) */
        .orbit-3 { width: 420px; height: 420px; animation-duration: 35s; }
        .planet-3 { width: 40px; height: 40px; background: linear-gradient(135deg, #3b82f6, #10b981); top: 40px; left: 190px; }

        /* Orbit 4: Planet Keempat (Mars/Merah) */
        .orbit-4 { width: 540px; height: 540px; animation-duration: 45s; }
        .planet-4 { width: 30px; height: 30px; background: #ef4444; top: 50px; left: 250px; }

        @keyframes rotateOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- Header Teks Atas --- */
        .header-ui {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            z-index: 10;
            padding: 0 20px;
        }

        .header-ui h1 {
            font-size: 28px;
            font-weight: 600;
            background: linear-gradient(to right, #38bdf8, #a855f7, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header-ui p {
            font-size: 14px;
            color: #94a3b8;
        }

        /* --- Kotak Pesan Interaktif (Modal) --- */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 10, 0.8);
            backdrop-filter: blur(8px);
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .message-card {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 30px;
            border-radius: 24px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            transform: translateY(20px);
            transition: transform 0.4s ease;
        }

        .modal-overlay.active .message-card {
            transform: translateY(0);
        }

        .message-card h3 {
            color: #38bdf8;
            font-size: 18px;
            margin-bottom: 12px;
        }

        .message-card p {
            font-size: 15px;
            line-height: 1.6;
            color: #f8fafc;
            margin-bottom: 24px;
        }

        .close-btn {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .close-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Latar Belakang Luar Angkasa -->
    <div class="stars" id="starField"></div>

    <!-- Teks Judul -->
    <div class="header-ui">
        <h1 id="main-title">Galaksi & Tata Surya Spesial</h1>
        <p id="sub-title">Klik Matahari atau salah satu planet di orbitnya untuk menjelajahi pesan...</p>
    </div>

    <!-- Sistem Tata Surya Mini -->
    <div class="solar-system">
        <!-- Matahari -->
        <div class="sun" onclick="openMessage('sun')">Pusat</div>

        <!-- Planet 1 -->
        <div class="orbit orbit-1">
            <div class="planet planet-1" onclick="openMessage(0)" title="Planet 1"></div>
        </div>
        <!-- Planet 2 -->
        <div class="orbit orbit-2">
            <div class="planet planet-2" onclick="openMessage(1)" title="Planet 2"></div>
        </div>
        <!-- Planet 3 -->
        <div class="orbit orbit-3">
            <div class="planet planet-3" onclick="openMessage(2)" title="Planet 3"></div>
        </div>
        <!-- Planet 4 -->
        <div class="orbit orbit-4">
            <div class="planet planet-4" onclick="openMessage(3)" title="Planet 4"></div>
        </div>
    </div>

    <!-- Modal Kotak Pesan -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="message-card">
            <h3 id="planetTitle">Pesan dari Orbit 🌟</h3>
            <p id="messageText">Isi pesan akan tampil di sini...</p>
            <button class="close-btn" onclick="closeModal()">Lanjut Menjelajah 🚀</button>
        </div>
    </div>

    <script>
        // --- DATA PESAN UNTUK TIAP PLANET & MATAHARI (Bisa kamu custom!) ---
        const messages = {
            'sun': {
                title: "Pusat Galaksi (Matahari) ☀️",
                text: "Selmaaaa, Makasih ya udah mau temenan sama aku,makasih udaa mau jadi bagian kecil hidupku"
            },
            0: {
                title: "Planet Biru 🌌",
                text: "Untuk anak yang selalu cerita dan ga pernah sedih,selalu menyembunyikan rasa sedihnya dengan senyuman."
            },
            1: {
                title: "Planet Ungu ✨",
                text: "Untuk orang yang selalu sembunyikan seluruh masalahnya dengan senyuman, dan membagi vibe cerianya ke orang - orang."
            },
            2: {
                title: "Planet Hijau-Biru 🌍",
                text: "Untuk anak kecil yang sudah dewasa melawan arus dan keras dunia,dengan lika liku yang begitu banyak,Wanita yang kuat dan indah ini."
            },
            3: {
                title: "Planet Merah 🚀",
                text: "Untuk kamu yang selalu ada buat orang dan selalu membagi senyuman,makasih udah tunjukin senyuman manismu ke seluruh dunia, AKU UCAPIN MAKASIH UNTUK SEMUA HAL YANG KAMU LAKUKAN SELMA GITA SARI."
            }
        };

        const modalOverlay = document.getElementById('modalOverlay');
        const planetTitle = document.getElementById('planetTitle');
        const messageText = document.getElementById('messageText');
        const subTitle = document.getElementById('sub-title');

        let openedCount = 0;

        function openMessage(planetKey) {
            const data = messages[planetKey];
            planetTitle.innerText = data.title;
            messageText.innerText = data.text;
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            openedCount++;
            if(openedCount >= 5) {
                subTitle.innerText = "Semua planet sudah dikunjungi! ✨ Semoga pesannya berkesan ya!, maaf kalau aku banyak kurangnya untukmu";
            } else {
                subTitle.innerText = `Planet dikunjungi: ${openedCount}/5. Silakan klik planet lain!`;
            }
        }

        // Membuat efek bintang-bintang kecil secara otomatis di background
        const starField = document.getElementById('starField');
        for (let i = 0; i < 80; i++) {
            let star = document.createElement('div');
            star.style.position = 'absolute';
            star.style.width = `${Math.random() * 3}px`;
            star.style.height = star.style.width;
            star.style.background = '#ffffff';
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.opacity = Math.random();
            star.style.borderRadius = '50%';
            starField.appendChild(star);
        }
    </script>
</body>
</html>
